# Render Blueprint: one free Python web service serving the phone page and the API from one origin.
services:
  - type: web
    name: phone-sensor-recorder
    runtime: python
    plan: free
    rootDir: cloud_app
    buildCommand: pip install -r requirements.txt
    # single worker: session state and file writes live in one process
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ACCESS_TOKEN
        sync: false          # you are asked for the value when creating the Blueprint; never committed
      - key: DATA_DIR
        value: /tmp/phone-recordings
